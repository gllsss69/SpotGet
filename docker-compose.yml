services:
  web:
    build: .
    container_name: spotget-app
    ports:
      - "80:8080"
    volumes:
      - visitor-data:/app/data
      - ./cookies.txt:/app/data/cookies.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  visitor-data:
